<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5d3f">
<title>Управление сайтом — Лесник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="../seed.js"></script>
<script src="../store.js"></script>
</head>
<body>

<!-- ═════════ вход ═════════ -->
<section class="screen" id="scr-login" aria-label="Вход">
  <div class="wrap">
    <div class="login">
      <p class="login__word">ЛЕСНИК</p>
      <p class="login__sub">Управление сайтом</p>
      <div class="note note--info">Это прототип. Пароль подойдёт любой, данные хранятся в вашем браузере и никуда не уходят.</div>
      <form id="loginForm" novalidate>
        <input type="text" name="username" value="lesnik" autocomplete="username" class="sr-only" aria-hidden="true" tabindex="-1">
        <label class="field">
          <span>Пароль</span>
          <input type="password" name="pass" autocomplete="current-password" required>
          <em class="err">Введите пароль</em>
        </label>
        <button class="btn btn--solid btn--full" type="submit">Войти</button>
      </form>
    </div>
  </div>
</section>

<!-- ═════════ рабочая часть ═════════ -->
<div id="app" hidden>

  <header class="top">
    <div class="wrap top__in">
      <button class="top__back" type="button" id="back" hidden aria-label="Назад">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="top__title">
        <b id="topTitle">Управление сайтом</b>
        <span id="topSub">Лесник</span>
      </div>
      <a class="top__act" id="viewSite" href="../" target="_blank" rel="noopener">На сайт</a>
    </div>
  </header>

  <main>
    <!-- главная -->
    <section class="screen" id="scr-home">
      <div class="wrap">
        <div class="quick" id="quick"></div>

        <div class="group">
          <div class="group__head"><h2>Разделы</h2></div>
          <div class="tiles" id="tiles"></div>
        </div>

        <div class="group">
          <div class="group__head"><h2>Данные</h2></div>
          <div class="card">
            <p class="lede" id="storeState">—</p>
            <div class="btn-row">
              <button class="btn btn--sm" type="button" data-go="history">История изменений</button>
              <button class="btn btn--sm btn--danger" type="button" id="resetAll">Сбросить демонстрацию</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- партии -->
    <section class="screen" id="scr-lots">
      <div class="wrap">
        <div class="filters" id="lotFilters">
          <button type="button" data-lf="live" aria-pressed="true">Открытые</button>
          <button type="button" data-lf="closed" aria-pressed="false">Закрытые</button>
          <button type="button" data-lf="all" aria-pressed="false">Все</button>
        </div>
        <label class="field">
          <span class="sr-only">Поиск по партиям</span>
          <input type="search" id="lotSearch" placeholder="Найти партию" autocomplete="off">
        </label>
        <div class="rows" id="lotRows"></div>
        <div class="empty" id="lotEmpty" hidden>Здесь пока пусто.</div>
      </div>
    </section>

    <!-- редактор партии -->
    <section class="screen" id="scr-lot">
      <div class="wrap" id="lotForm"></div>
    </section>

    <!-- категории -->
    <section class="screen" id="scr-cats">
      <div class="wrap" id="catsForm"></div>
    </section>

    <!-- фото -->
    <section class="screen" id="scr-photos">
      <div class="wrap" id="photosBox"></div>
    </section>

    <!-- заявки -->
    <section class="screen" id="scr-leads">
      <div class="wrap" id="leadsBox"></div>
    </section>

    <!-- оптовики -->
    <section class="screen" id="scr-buyers">
      <div class="wrap" id="buyersBox"></div>
    </section>

    <!-- тексты и контакты -->
    <section class="screen" id="scr-texts">
      <div class="wrap" id="textsBox"></div>
    </section>

    <!-- история -->
    <section class="screen" id="scr-history">
      <div class="wrap" id="histBox"></div>
    </section>
  </main>

  <div class="bar" id="bar" hidden>
    <div class="bar__in" id="barIn"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
